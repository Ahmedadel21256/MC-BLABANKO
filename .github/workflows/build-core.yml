name: Verify SHABAB SMP source
on:
  push:
    paths:
      - '.github/workflows/build-core.yml'
      - 'plugins/shabab-core/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  compile-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21 for Paper API compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build core plugin with Maven
        run: mvn --batch-mode -f plugins/shabab-core/pom.xml -DskipTests package
      - name: Check Python syntax
        run: python3 -m compileall -q scripts
      - name: Validate local-only network and offline operator generation
        run: |
          python3 scripts/configure_network.py "$RUNNER_TEMP/shabab-ci"
          python3 scripts/grant_local_op.py "$RUNNER_TEMP/shabab-ci"
          python3 scripts/validate_network.py "$RUNNER_TEMP/shabab-ci"
          python3 - <<'PY'
          import json, os, pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"]) / "shabab-ci"
          for server in ("lobby", "survival", "bedwars", "skywars"):
              entries=json.loads((base / server / "ops.json").read_text())
              assert len(entries)==1 and entries[0]["name"]=="I_luca1" and entries[0]["level"]==4
          print("PASS: local-only operator provisioning")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ShababCore-plugin
          path: plugins/shabab-core/target/shabab-core-1.0.0.jar
          if-no-files-found: error
